name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: notes_test
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://notes:ci-only-password@localhost:5432/notes_test
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: End-to-end tests
        run: npm run test:e2e

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: notes
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the image and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test the API
        run: |
          curl --fail --silent --show-error http://localhost:3000/health/ready
          echo
          curl --fail --silent --show-error -X POST http://localhost:3000/notes \
            -H "Content-Type: application/json" \
            -d '{"title":"CI smoke test","content":"Hello"}'
          echo
          curl --fail --silent --show-error http://localhost:3000/notes
          echo

      - name: Check that the API container does not run as root
        run: test "$(docker compose exec -T api id -u)" != "0"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
